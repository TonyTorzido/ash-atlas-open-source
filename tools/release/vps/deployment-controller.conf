# Canonical Ash Atlas deployment-controller paths. This file contains no secrets.
ASH_ATLAS_CONTROL_ROOT=/var/lib/ash-atlas/deploy-operations
ASH_ATLAS_STATUS_ROOT=/var/lib/ash-atlas-deployment-status
ASH_ATLAS_LOG_ROOT=/var/log/ash-atlas/deploy-operations
ASH_ATLAS_CONTROL_LOCK=/run/lock/ash-atlas-deploy-control.lock
ASH_ATLAS_DEPLOY_LOCK=/run/lock/ash-atlas-test-update.lock
ASH_ATLAS_UPDATER=/home/debian/ops/ash-atlas-server/deploy-test-update.sh
ASH_ATLAS_CONTROLLER=/home/debian/ops/ash-atlas-server/deploy-control.sh
ASH_ATLAS_DEPLOY_REQUEST_LOCK=/run/lock/ash-atlas-deployment-request.lock
ASH_ATLAS_DEPLOY_REQUEST_REF=refs/heads/integration/deployment-requests
ASH_ATLAS_DEPLOY_REQUEST_STATE_ROOT=/var/lib/ash-atlas/deployment-requests
ASH_ATLAS_TIMING_ROOT=/var/log/ash-atlas/deployments
ASH_ATLAS_GAME_CURRENT=/srv/ash-atlas/game/current
ASH_ATLAS_PUBLIC_CURRENT=/srv/www/playashatlas/current
ASH_ATLAS_GAME_RELEASE_ROOT=/srv/ash-atlas/game/releases
ASH_ATLAS_PUBLIC_RELEASE_ROOT=/srv/www/playashatlas/game-releases
ASH_ATLAS_MIRROR_ROOT=/home/debian/repos/game.git
ASH_ATLAS_WORKTREE_ROOT=/home/debian/worktrees
