apply plugin: 'com.android.application'

android {
    namespace = "com.ashatlas.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ashatlas.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI injects independent store identity without rewriting this file
        // (-PashAtlasVersionCode/-PashAtlasVersionName); these are the defaults.
        versionCode providers.gradleProperty("ashAtlasVersionCode").getOrElse("9").toInteger()
        versionName providers.gradleProperty("ashAtlasVersionName").getOrElse("1.1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // NativeRuntime disables the push plugin's persisted Firebase auto-init flag.
    // Keep the direct API dependency aligned with @capacitor/push-notifications 8.1.2.
    implementation "com.google.firebase:firebase-messaging:${rootProject.ext.has('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'}"
    // Purchases plugin: Play Billing Library 8 (adds com.android.vending.BILLING).
    implementation "com.android.billingclient:billing:$playBillingVersion"
    // StoreUpdate plugin: Play In-App Updates (immediate flow).
    implementation "com.google.android.play:app-update:$playAppUpdateVersion"
    // DeviceTrust plugin: Play Integrity Standard API + fused location (mock detection).
    implementation "com.google.android.play:integrity:$playIntegrityVersion"
    implementation "com.google.android.gms:play-services-location:$playServicesLocationVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register("printAshAtlasReleaseIdentity") {
    doLast {
        println "versionName=${android.defaultConfig.versionName}"
        println "versionCode=${android.defaultConfig.versionCode}"
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Crashlytics needs its build ID whenever Firebase initializes, and Firebase
        // only initializes when this public config is present. Without the file
        // neither plugin is applied and Crashlytics stays inert (dev builds).
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications and Crashlytics won't work")
}
